<div class="min-h-screen bg-white flex flex-col items-center">
  <div class="w-full max-w-md flex flex-col flex-1">
    <div
      class="flex-1 flex flex-col items-center justify-center px-6 py-12 text-center"
    >
      <!-- Brand header -->
      <div class="mb-7">
        <app-auth-branding />
      </div>

      <!-- Icon -->
      <div
        class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-6"
      >
        <svg
          class="w-8 h-8 text-gray-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
          />
        </svg>
      </div>

      <h1 class="text-2xl font-bold text-gray-900 mb-3">
        {{ 'NO_CLINIC.TITLE' | translate }}
      </h1>
      <p class="text-base text-gray-600 max-w-sm leading-relaxed mb-8">
        {{ 'NO_CLINIC.BODY' | translate }}
      </p>

      <div class="w-full max-w-sm">
        <button
          type="button"
          (click)="onSignOut()"
          class="w-full rounded-xl border border-gray-300 px-6 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
        >
          {{ 'NO_CLINIC.SIGN_OUT' | translate }}
        </button>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="h-8 bg-white flex items-center justify-center">
      <div class="w-32 h-1 bg-black rounded-full"></div>
    </div>
  </div><!-- /max-w-md -->
</div>
