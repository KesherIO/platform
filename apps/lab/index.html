<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />

    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- TODO: once `lab` has a deploy target (Vercel/other), add real HTTP response
         headers there: `Content-Security-Policy: frame-ancestors 'self'` and
         `X-Frame-Options: SAMEORIGIN`. Both are ignored when set via <meta>, so
         until then this app has no clickjacking protection (see vercel.json for
         how `frontend` does it). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src 'self' https://www.openstreetmap.org; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.scss" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
